services:

  postgres:
    image: postgres:17

    container_name: auth-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth_service}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      TZ: UTC
      PGTZ: UTC

    ports:
      - "5433:5432"

    volumes:
      - auth_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-auth_service}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


volumes:

  auth_postgres_data:
    name: auth-postgres-data