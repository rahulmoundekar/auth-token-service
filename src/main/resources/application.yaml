spring:
  application:
    name: auth-token-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:auth_service}
    username: ${DB_USERNAME:auth_app}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  management:
    info:
      app:
        name: auth-token-service
        description: Multi-tenant authentication and authorization service
        version: 0.0.1
    endpoints:
      web:
        exposure:
          include: health,info
    endpoint:
      health:
        probes:
          enabled: true
        show-details: when_authorized

server:
  port: ${SERVER_PORT:8082}

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:auth-token-service}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}

refresh-token:
  expiration: ${REFRESH_TOKEN_EXPIRATION:604800000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.rahul: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
