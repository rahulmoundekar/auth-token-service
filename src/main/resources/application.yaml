spring:
  application:
    name: auth-token-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:auth_service}
    username: ${DB_USERNAME:auth_app}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8082}

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:auth-token-service}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}

refresh-token:
  expiration: ${REFRESH_TOKEN_EXPIRATION:604800000}