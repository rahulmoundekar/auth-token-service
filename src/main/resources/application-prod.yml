spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8082}

logging:
  level:
    root: INFO
    com.rahul: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN