spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:auth_service}
    username: ${DB_USERNAME:auth_app}
    password: ${DB_PASSWORD:root}

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8082}

logging:
  level:
    com.rahul: DEBUG
    org.springframework.security: INFO